name: Quality checks

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/api-tests.yml"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: carbon_esg
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carbon_esg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://carbon_esg_app:ci-test-password@localhost:5432/carbon_esg
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/carbon_esg
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
      - name: Bootstrap least-privilege application database role
        run: |
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/bootstrap_runtime_role.sql
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE carbon_esg_app WITH PASSWORD 'ci-test-password'"
      - name: Verify database schema and security controls
        run: python -m pytest tests/test_postgres_migration.py -q
      - name: Run API tests
        run: python -m pytest -q

  web-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
