name: Deployment validation

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "render.yaml"
      - "DEPLOYMENT.md"
      - ".github/workflows/deploy-validation.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "render.yaml"
      - "DEPLOYMENT.md"
      - ".github/workflows/deploy-validation.yml"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Validate Alembic migration SQL without connecting to a database
        run: DATABASE_URL_UNPOOLED=postgresql://test:test@localhost/carbon_esg alembic upgrade head --sql > /tmp/carbon-esg-migration.sql
      - name: Upload reviewed migration SQL artifact
        uses: actions/upload-artifact@v4
        with:
          name: carbon-esg-migration-sql
          path: /tmp/carbon-esg-migration.sql
          if-no-files-found: error
          retention-days: 7

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example-api.onrender.com
