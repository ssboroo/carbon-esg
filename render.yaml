# Render Blueprint: free preview deployment. Free services sleep after inactivity.
# The web app uses the Node runtime because Managed Auth needs same-origin server routes.
services:
  - type: web
    name: carbon-esg-api
    runtime: python
    plan: free
    region: singapore
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: carbon-esg-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEON_AUTH_BASE_URL
        value: https://ep-snowy-wind-a1bftha7.neonauth.ap-southeast-1.aws.neon.tech/neondb/auth
      - key: NEON_AUTH_JWKS_URL
        value: https://ep-snowy-wind-a1bftha7.neonauth.ap-southeast-1.aws.neon.tech/neondb/auth/.well-known/jwks.json

  - type: web
    name: carbon-esg-web
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: carbon-esg-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEON_AUTH_BASE_URL
        value: https://ep-snowy-wind-a1bftha7.neonauth.ap-southeast-1.aws.neon.tech/neondb/auth
      - key: NEON_AUTH_COOKIE_SECRET
        generateValue: true
